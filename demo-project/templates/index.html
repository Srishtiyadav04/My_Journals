<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Journals</title>
  <style>
    :root {
      --bg: #ffffff; --card: #f4f4f1; --text: #2c2c2a; --sub: #5f5e5a;
      --line: #d3d1c7; --accent: #3b6cf6; --on: #ffffff; --err: #c0392b;
    }
    [hidden] { display: none !important; }
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: var(--text); }
    input[type="text"], input[type="password"], textarea, select { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-bottom: 0.5rem; font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
    button { font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 0.35rem 0.8rem; cursor: pointer; }
    button.primary, .btn { background: var(--accent); color: var(--on); border-color: var(--accent); }
    .btn { display: inline-block; border-radius: 6px; padding: 0.4rem 0.9rem; text-decoration: none; border: 1px solid var(--accent); }
    .btn.secondary { background: var(--card); color: var(--text); border-color: var(--line); }
    .back { display: inline-block; margin-bottom: 0.6rem; color: var(--accent); text-decoration: none; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.9rem; color: var(--sub); }
    .hero { text-align: center; padding: 1.5rem 0 0.5rem; }
    .hero p { color: var(--sub); }
    .stack { display: grid; gap: 0.6rem; margin-top: 1.2rem; }
    .stack .btn, .stack button { text-align: center; padding: 0.7rem 1rem; font-size: 1rem; }
    label.field { display: block; margin-bottom: 0.4rem; color: var(--sub); font-size: 0.9rem; }
    label.field input { margin-top: 0.2rem; }
    .check { display: block; margin: 0.2rem 0 0.8rem; color: var(--sub); font-size: 0.9rem; }
    .list { display: grid; gap: 0.6rem; margin: 0.8rem 0; }
    .card { display: flex; gap: 0.7rem; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.8rem; color: var(--text); text-decoration: none; }
    .card:hover { border-color: var(--accent); }
    .card .grow { flex: 1; min-width: 0; }
    .card strong { display: block; }
    .card .go { color: var(--sub); font-size: 1.2rem; }
    .sub { color: var(--sub); font-size: 0.85rem; }
    .snippet { color: var(--sub); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-title { line-height: 1.3; }
    .meta { font-size: 0.8rem; color: var(--sub); margin: 0.2rem 0 0.6rem; }
    .note-text { line-height: 1.5; margin-bottom: 0.8rem; white-space: pre-wrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
    .error { color: var(--err); min-height: 1.2em; margin: 0.2rem 0; }
    .row { display: flex; gap: 0.4rem; }
    .row input { margin-bottom: 0; }
    details { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 0.8rem; margin: 0.6rem 0; }
    summary { cursor: pointer; font-weight: 500; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; margin-top: 0.6rem; }
    .theme-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px 10px; border-radius: 8px; border-width: 2px; border-style: solid; text-align: left; }
    .theme-btn.on { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-dots span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; border: 1px solid rgba(128, 128, 128, 0.5); }
    .seg { display: flex; gap: 0.4rem; margin: 0.6rem 0 0.2rem; }
    .seg button { flex: 1; }
    .seg button.on, .wp-grid button.on { background: var(--accent); color: var(--on); border-color: var(--accent); }
    .wp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; margin-top: 0.6rem; }
    .wp-grid button { text-align: left; padding: 0.6rem 0.7rem; }
    .style-box { display: grid; gap: 0.5rem; margin: 0.3rem 0 0.6rem; padding: 0.6rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px; font-size: 0.9rem; }
    .style-box label { display: block; color: var(--sub); }
    .style-box select { margin: 0.2rem 0 0; }
    .style-box input[type="range"] { width: 100%; }
    details.style-group { margin: 0.4rem 0; padding: 0.45rem 0.7rem; }
    details details.style-group { background: var(--bg); }
    .style-group .style-box { margin: 0.5rem 0 0.2rem; padding: 0; border: none; background: transparent; }
    .swatches { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: 0.2rem; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; padding: 0; border: 2px solid var(--line); }
    .swatch.on { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type="color"] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--line); background: none; }

    /* Button and card press effects */
    button, .btn, .card, .theme-btn, .swatch {
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease, border-color 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) {
      button:hover, .btn:hover, .card:hover {
        transform: translateY(-1px);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      }
    }
    button:active, .btn:active, .card:active, .theme-btn:active, .swatch:active {
      transform: translateY(1px) scale(0.96);
      box-shadow: none;
      filter: brightness(0.92);
    }
    button:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }
    .btn { cursor: pointer; }
    button:focus-visible, .btn:focus-visible, .card:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      button, .btn, .card, .theme-btn, .swatch { transition: none; }
      button:hover, .btn:hover, .card:hover,
      button:active, .btn:active, .card:active { transform: none; }
    }

    /* Live wallpaper */
    #wallpaper { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; display: none; }
    html.wp { background: var(--bg); }
    html.wp #wallpaper { display: block; }
    html.wp body {
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      border-radius: 14px;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }
    html.wp[data-theme="contrast"] body { background: var(--bg); }
  </style>
</head>
<body>
  <header id="topbar" class="topbar" hidden></header>
  <main id="app"></main>

  <script>
    const THEMES = {
      light:    { label: "Light",         dark: false, bg: "#ffffff", card: "#f4f4f1", text: "#2c2c2a", sub: "#5f5e5a", line: "#d3d1c7", accent: "#3b6cf6", on: "#ffffff", err: "#c0392b" },
      dark:     { label: "Dark",          dark: true,  bg: "#1f1f1e", card: "#2c2c2a", text: "#f1efe8", sub: "#b4b2a9", line: "#444441", accent: "#85b7eb", on: "#042c53", err: "#f09595" },
      midnight: { label: "Midnight",      dark: true,  bg: "#0f172a", card: "#1e293b", text: "#e2e8f0", sub: "#94a3b8", line: "#334155", accent: "#818cf8", on: "#1e1b4b", err: "#fca5a5" },
      sepia:    { label: "Sepia",         dark: false, bg: "#f6efe0", card: "#ece1c8", text: "#433422", sub: "#7a6548", line: "#d6c7a3", accent: "#9a5b13", on: "#ffffff", err: "#a32d2d" },
      forest:   { label: "Forest",        dark: false, bg: "#f1f6ef", card: "#e0ebdc", text: "#1f3326", sub: "#4f6b57", line: "#bcd2b8", accent: "#2f7d4f", on: "#ffffff", err: "#b3261e" },
      ocean:    { label: "Ocean",         dark: false, bg: "#eef6fb", card: "#dcecf7", text: "#12324a", sub: "#4a6a82", line: "#b5d3e6", accent: "#1769aa", on: "#ffffff", err: "#b3261e" },
      rose:     { label: "Rose",          dark: false, bg: "#fdf1f4", card: "#f8e0e7", text: "#3d1f2a", sub: "#7a4a5a", line: "#efc3cf", accent: "#c2185b", on: "#ffffff", err: "#b3261e" },
      lavender: { label: "Lavender",      dark: false, bg: "#f4f1fb", card: "#e7e0f5", text: "#2a2342", sub: "#5d5480", line: "#cfc5e8", accent: "#6a4fc4", on: "#ffffff", err: "#b3261e" },
      sunset:   { label: "Sunset",        dark: true,  bg: "#2a1a14", card: "#3b2820", text: "#fbeadf", sub: "#d2ab98", line: "#5a3d31", accent: "#ff9a62", on: "#3b1a08", err: "#ffb4a8" },
      contrast: { label: "High contrast", dark: true,  bg: "#000000", card: "#111111", text: "#ffffff", sub: "#d0d0d0", line: "#ffffff", accent: "#ffd400", on: "#000000", err: "#ff8a80" },
    };
    const THEME_VARS = {
      bg: "--bg", card: "--card", text: "--text", sub: "--sub",
      line: "--line", accent: "--accent", on: "--on", err: "--err",
    };
    const FONTS = {
      sans: "system-ui, sans-serif",
      serif: "Georgia, 'Times New Roman', serif",
      book: "Palatino, 'Palatino Linotype', 'Book Antiqua', serif",
      mono: "ui-monospace, Menlo, monospace",
      cursive: "'Snell Roundhand', 'Segoe Script', 'Comic Sans MS', cursive",
      rounded: "ui-rounded, 'SF Pro Rounded', system-ui, sans-serif",
    };
    const FONT_LABELS = {
      sans: "Sans", serif: "Serif", book: "Book", mono: "Mono",
      cursive: "Handwritten", rounded: "Rounded",
    };
    const SWATCHES = ["", "#D85A30", "#E24B4A", "#BA7517", "#639922",
                      "#1D9E75", "#378ADD", "#7F77DD", "#D4537E", "#888780"];
    const AUTH_PAGES = ["welcome", "login", "signup"];

    const app = document.getElementById("app");
    const topbar = document.getElementById("topbar");
    let renderId = 0;
    let currentUser = null;

    function h(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    async function api(url, options) {
      try {
        const r = await fetch(url, options);
        let data = null;
        try { data = await r.json(); } catch (e) {}
        if (r.status === 401 && !url.startsWith("/api/auth/")) {
          currentUser = null;
          renderTopbar();
          if (location.hash !== "#/welcome") { location.hash = "#/welcome"; } else { route(); }
          return { ok: false, data: { error: "Please log in" } };
        }
        return { ok: r.ok, data: data };
      } catch (e) {
        return { ok: false, data: { error: "Couldn't reach the server" } };
      }
    }

    function backLink(href, label) {
      const a = h("a", "back", "\u2190 " + label);
      a.href = href;
      return a;
    }

    function showMessage(text) {
      app.textContent = "";
      app.append(h("p", "error", text), backLink("#/", "All journals"));
    }

    function plural(n, word) {
      return n + " " + word + (n === 1 ? "" : "s");
    }

    let theme = "light";
    try {
      const saved = localStorage.getItem("journalTheme");
      if (saved && THEMES[saved]) theme = saved;
    } catch (e) {}

    function applyTheme() {
      const t = THEMES[theme];
      const root = document.documentElement;
      root.dataset.theme = theme;
      for (const key of Object.keys(THEME_VARS)) {
        root.style.setProperty(THEME_VARS[key], t[key]);
      }
      root.style.colorScheme = t.dark ? "dark" : "light";
      document.querySelectorAll(".theme-btn").forEach(function (b) {
        const on = b.dataset.theme === theme;
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }

    function buildThemeButtons(grid) {
      for (const key of Object.keys(THEMES)) {
        const t = THEMES[key];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "theme-btn";
        btn.dataset.theme = key;
        btn.style.background = t.bg;
        btn.style.color = t.text;
        btn.style.borderColor = t.line;

        const name = document.createElement("span");
        name.textContent = t.label;

        const dots = document.createElement("span");
        dots.className = "theme-dots";
        for (const colour of [t.accent, t.text, t.card]) {
          const d = document.createElement("span");
          d.style.background = colour;
          dots.append(d);
        }

        btn.append(name, dots);
        btn.onclick = function () {
          theme = key;
          applyTheme();
          try { localStorage.setItem("journalTheme", theme); } catch (err) {}
        };
        grid.append(btn);
      }
    }

    applyTheme();

    const Wallpaper = (function () {
      const KEY = "journalWallpaper";
      const PRESETS = {
        none: "None", aurora: "Aurora", stars: "Starry night",
        rain: "Rain", fireflies: "Fireflies", waves: "Waves",
      };
      let current = "none";
      try {
        const saved = localStorage.getItem(KEY);
        if (saved && PRESETS[saved]) current = saved;
      } catch (e) {}

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const canvas = document.createElement("canvas");
      canvas.id = "wallpaper";
      canvas.setAttribute("aria-hidden", "true");
      document.body.prepend(canvas);
      const ctx = canvas.getContext("2d");

      function rgba(hex, a) {
        const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
        if (!m) return "rgba(128,128,128," + a + ")";
        const n = parseInt(m[1], 16);
        return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
      }

      function colors() {
        const cs = getComputedStyle(document.documentElement);
        const get = function (name) { return cs.getPropertyValue(name).trim(); };
        return { bg: get("--bg"), accent: get("--accent"), text: get("--text") };
      }

      const WAVES = [
        { a: 0.30, amp: 0.05, k: 1.6, sp: 0.5, y: 0.62 },
        { a: 0.22, amp: 0.06, k: 1.1, sp: -0.35, y: 0.72 },
        { a: 0.16, amp: 0.07, k: 0.8, sp: 0.25, y: 0.82 },
      ];

      const makers = {
        aurora: function (w, h) {
          const blobs = [0, 1, 2, 3].map(function (i) {
            return { ph: Math.random() * 6.28, sp: 0.08 + Math.random() * 0.1, r: 0.35 + Math.random() * 0.2, ci: i % 3 };
          });
          return function (c, t, col) {
            c.fillStyle = col.bg;
            c.fillRect(0, 0, w, h);
            const cols = [col.accent, "#7F77DD", "#1D9E75"];
            for (const b of blobs) {
              const x = w * (0.5 + 0.4 * Math.sin(t * b.sp + b.ph));
              const y = h * (0.5 + 0.35 * Math.cos(t * b.sp * 1.3 + b.ph * 2));
              const r = Math.max(w, h) * b.r;
              const g = c.createRadialGradient(x, y, 0, x, y, r);
              g.addColorStop(0, rgba(cols[b.ci], 0.55));
              g.addColorStop(1, rgba(cols[b.ci], 0));
              c.fillStyle = g;
              c.fillRect(0, 0, w, h);
            }
          };
        },

        stars: function (w, h) {
          const n = Math.round((w * h) / 9000);
          const stars = Array.from({ length: n }, function () {
            return { x: Math.random() * w, y: Math.random() * h, r: 0.6 + Math.random() * 1.4, ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.6, dr: 2 + Math.random() * 6 };
          });
          return function (c, t, col) {
            c.fillStyle = col.bg;
            c.fillRect(0, 0, w, h);
            for (const s of stars) {
              const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
              c.fillStyle = rgba(col.text, a);
              c.beginPath();
              c.arc((s.x + t * s.dr) % w, s.y, s.r, 0, 6.2832);
              c.fill();
            }
          };
        },

        rain: function (w, h) {
          const n = Math.round(w / 12);
          const drops = Array.from({ length: n }, function () {
            return { x: Math.random() * w, y: Math.random() * h, l: 10 + Math.random() * 16, v: 380 + Math.random() * 320 };
          });
          let last = 0;
          return function (c, t, col) {
            const dt = last ? Math.min(t - last, 0.1) : 0;
            last = t;
            c.fillStyle = col.bg;
            c.fillRect(0, 0, w, h);
            c.strokeStyle = rgba(col.accent, 0.45);
            c.lineWidth = 1.2;
            c.lineCap = "round";
            c.beginPath();
            for (const d of drops) {
              d.y += d.v * dt;
              d.x -= d.v * dt * 0.12;
              if (d.y > h + d.l) { d.y = -d.l; d.x = Math.random() * w; }
              if (d.x < -10) d.x = w + 10;
              c.moveTo(d.x, d.y);
              c.lineTo(d.x + d.l * 0.12, d.y - d.l);
            }
            c.stroke();
          };
        },

        fireflies: function (w, h) {
          const n = Math.max(18, Math.round((w * h) / 22000));
          const flies = Array.from({ length: n }, function () {
            return { x: Math.random() * w, y: Math.random() * h, a: Math.random() * 6.28, v: 10 + Math.random() * 22, ph: Math.random() * 6.28, r: 14 + Math.random() * 18 };
          });
          let last = 0;
          return function (c, t, col) {
            const dt = last ? Math.min(t - last, 0.1) : 0;
            last = t;
            c.fillStyle = col.bg;
            c.fillRect(0, 0, w, h);
            for (const f of flies) {
              f.a += (Math.random() - 0.5) * 2 * dt;
              f.x = (f.x + Math.cos(f.a) * f.v * dt + w) % w;
              f.y = (f.y + Math.sin(f.a) * f.v * dt + h) % h;
              const glow = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 1.2 + f.ph));
              const g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
              g.addColorStop(0, rgba(col.accent, 0.7 * glow));
              g.addColorStop(1, rgba(col.accent, 0));
              c.fillStyle = g;
              c.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
            }
          };
        },

        waves: function (w, h) {
          return function (c, t, col) {
            c.fillStyle = col.bg;
            c.fillRect(0, 0, w, h);
            for (const L of WAVES) {
              c.beginPath();
              c.moveTo(0, h);
              for (let x = 0; x <= w; x += 8) {
                const y = h * L.y + Math.sin((x / w) * 6.2832 * L.k + t * L.sp * 2) * h * L.amp;
                c.lineTo(x, y);
              }
              c.lineTo(w, h);
              c.closePath();
              c.fillStyle = rgba(col.accent, L.a);
              c.fill();
            }
          };
        },
      };

      let draw = null;
      let raf = 0;
      let lastFrame = 0;
      let lastW = 0;
      let lastH = 0;
      const t0 = performance.now();

      function size() {
        lastW = window.innerWidth;
        lastH = window.innerHeight;
        canvas.width = Math.max(1, lastW);
        canvas.height = Math.max(1, lastH);
      }

      function build() {
        draw = current === "none" ? null : makers[current](canvas.width, canvas.height);
      }

      function frame(now) {
        raf = 0;
        if (!draw) return;
        if (now - lastFrame >= 33) {
          lastFrame = now;
          draw(ctx, (now - t0) / 1000, colors());
        }
        if (!document.hidden && !reduceMotion.matches) raf = requestAnimationFrame(frame);
      }

      function run() {
        cancelAnimationFrame(raf);
        raf = 0;
        if (!draw) return;
        lastFrame = 0;
        raf = requestAnimationFrame(frame);
      }

      function apply() {
        document.documentElement.classList.toggle("wp", current !== "none");
        size();
        build();
        run();
      }

      function set(key) {
        if (!PRESETS[key]) return;
        current = key;
        try { localStorage.setItem(KEY, key); } catch (e) {}
        apply();
      }

      let resizeTimer = 0;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          const w = window.innerWidth;
          const hgt = window.innerHeight;
          if (Math.abs(w - lastW) < 2 && Math.abs(hgt - lastH) < 120) return;
          apply();
        }, 150);
      });
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) run();
      });
      reduceMotion.addEventListener("change", run);
      new MutationObserver(run).observe(document.documentElement, {
        attributes: true, attributeFilter: ["data-theme"],
      });

      apply();

      return {
        presets: PRESETS,
        get: function () { return current; },
        set: set,
        reduced: function () { return reduceMotion.matches; },
      };
    })();

    function buildWallpaperButtons(container) {
      const grid = h("div", "wp-grid");
      function mark() {
        grid.querySelectorAll("button").forEach(function (b) {
          const on = b.dataset.wp === Wallpaper.get();
          b.classList.toggle("on", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }
      for (const key of Object.keys(Wallpaper.presets)) {
        const b = h("button", "", Wallpaper.presets[key]);
        b.type = "button";
        b.dataset.wp = key;
        b.onclick = function () {
          Wallpaper.set(key);
          mark();
        };
        grid.append(b);
      }
      container.append(grid);
      mark();
      if (Wallpaper.reduced()) {
        container.append(h("p", "sub", "Your system has reduced motion turned on, so the wallpaper stays still."));
      }
    }

    function buildThemePanel() {
      const box = h("details");
      box.append(h("summary", "", "Theme"));

      const seg = h("div", "seg");
      const tintBtn = h("button", "on", "Colour tint");
      tintBtn.type = "button";
      const wpBtn = h("button", "", "Live wallpaper");
      wpBtn.type = "button";
      seg.append(tintBtn, wpBtn);

      const tintPanel = h("div");
      const grid = h("div", "theme-grid");
      buildThemeButtons(grid);
      tintPanel.append(grid);

      const wpPanel = h("div");
      wpPanel.hidden = true;
      buildWallpaperButtons(wpPanel);

      function show(which) {
        const tint = which === "tint";
        tintPanel.hidden = !tint;
        wpPanel.hidden = tint;
        tintBtn.classList.toggle("on", tint);
        wpBtn.classList.toggle("on", !tint);
        tintBtn.setAttribute("aria-pressed", tint ? "true" : "false");
        wpBtn.setAttribute("aria-pressed", tint ? "false" : "true");
      }
      tintBtn.onclick = function () { show("tint"); };
      wpBtn.onclick = function () { show("wp"); };
      show("tint");

      box.append(seg, tintPanel, wpPanel);
      return box;
    }

    function renderTopbar() {
      topbar.textContent = "";
      topbar.hidden = !currentUser;
      if (!currentUser) return;
      const who = h("span", "", "Signed in as ");
      who.append(h("strong", "", currentUser.username));
      const out = h("button", "", "Log out");
      out.onclick = async function () {
        await api("/api/auth/logout", { method: "POST" });
        currentUser = null;
        renderTopbar();
        location.hash = "#/welcome";
      };
      topbar.append(who, out);
    }

    function applyText(el, s) {
      el.style.fontFamily = FONTS[s.font] || FONTS.sans;
      el.style.fontSize = s.size + "px";
      el.style.color = s.color || "";
    }

    function applyTitle(el, s) {
      applyText(el, s);
      el.style.fontWeight = s.bold ? "700" : "400";
    }

    function buildStyleControls(style, preview, commit, opts) {
      const box = document.createElement("div");
      box.className = "style-box";

      const fontLabel = document.createElement("label");
      fontLabel.textContent = "Font";
      const fontSel = document.createElement("select");
      for (const key of Object.keys(FONTS)) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = FONT_LABELS[key];
        fontSel.append(opt);
      }
      fontSel.value = style.font;
      fontSel.onchange = function () {
        style.font = fontSel.value;
        preview(style);
        commit();
      };
      fontLabel.append(fontSel);

      const sizeLabel = document.createElement("label");
      const sizeOut = document.createElement("span");
      sizeOut.textContent = style.size;
      sizeLabel.append("Size: ", sizeOut, " px");
      const range = document.createElement("input");
      range.type = "range";
      range.min = opts.min; range.max = opts.max; range.step = 1;
      range.value = style.size;
      range.oninput = function () {
        style.size = Number(range.value);
        sizeOut.textContent = style.size;
        preview(style);
      };
      range.onchange = function () { commit(); };
      sizeLabel.append(range);

      const colorLabel = document.createElement("label");
      colorLabel.append("Colour");
      const swatchRow = document.createElement("div");
      swatchRow.className = "swatches";
      const picker = document.createElement("input");
      picker.type = "color";
      picker.value = style.color || "#000000";
      picker.setAttribute("aria-label", "Custom colour");

      function markSwatches() {
        swatchRow.querySelectorAll(".swatch").forEach(function (b) {
          b.classList.toggle("on", b.dataset.col === style.color);
        });
      }
      for (const col of SWATCHES) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "swatch";
        b.dataset.col = col;
        b.style.background = col || "var(--text)";
        b.setAttribute("aria-label", col ? "Colour " + col : "Default colour");
        b.onclick = function () {
          style.color = col;
          if (col) picker.value = col;
          markSwatches();
          preview(style);
          commit();
        };
        swatchRow.append(b);
      }
      picker.oninput = function () {
        style.color = picker.value;
        markSwatches();
        preview(style);
      };
      picker.onchange = function () { commit(); };
      swatchRow.append(picker);
      colorLabel.append(swatchRow);
      markSwatches();

      box.append(fontLabel, sizeLabel, colorLabel);

      if (opts.bold) {
        const boldLabel = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = style.bold;
        cb.onchange = function () {
          style.bold = cb.checked;
          preview(style);
          commit();
        };
        boldLabel.append(cb, " Bold");
        box.append(boldLabel);
      }
      return box;
    }

    function buildAllControls(titleStyle, bodyStyle, previewTitle, previewBody, commit) {
      const wrap = document.createElement("div");

      function group(label, style, preview, opts) {
        const d = h("details", "style-group");
        d.append(h("summary", "", label));
        d.append(buildStyleControls(style, preview, commit, opts));
        return d;
      }

      wrap.append(
        group("Title style", titleStyle, previewTitle, { min: 14, max: 48, bold: true }),
        group("Text style", bodyStyle, previewBody, { min: 12, max: 32, bold: false })
      );
      return wrap;
    }

    function styleBody(titleStyle, bodyStyle) {
      return JSON.stringify({
        font: bodyStyle.font, size: bodyStyle.size, color: bodyStyle.color,
        title_font: titleStyle.font, title_size: titleStyle.size,
        title_color: titleStyle.color, title_bold: titleStyle.bold,
      });
    }

    function showWelcome() {
      renderId++;
      app.textContent = "";
      const hero = h("div", "hero");
      hero.append(
        h("h1", "", "My journals"),
        h("p", "", "Keep your notes organised in journals. Sign up to get started, or log in to continue.")
      );
      const stack = h("div", "stack");
      const signup = h("a", "btn", "Sign up");
      signup.href = "#/signup";
      const login = h("a", "btn secondary", "Log in");
      login.href = "#/login";
      stack.append(signup, login);
      app.append(hero, stack);
    }

    function showAuthForm(mode) {
      renderId++;
      app.textContent = "";
      const signup = mode === "signup";

      app.append(backLink("#/welcome", "Back"));
      app.append(h("h1", "", signup ? "Sign up" : "Log in"));

      const form = document.createElement("form");

      const userLabel = h("label", "field", "Username");
      const userInput = document.createElement("input");
      userInput.type = "text";
      userInput.autocomplete = "username";
      userInput.autocapitalize = "none";
      userInput.spellcheck = false;
      userInput.maxLength = 30;
      userLabel.append(userInput);
      if (signup) {
        userLabel.append(h("span", "sub", "3 to 30 characters: letters, numbers, dots, dashes, underscores."));
      }

      const passLabel = h("label", "field", "Password");
      const passInput = document.createElement("input");
      passInput.type = "password";
      passInput.autocomplete = signup ? "new-password" : "current-password";
      passInput.maxLength = 128;
      passLabel.append(passInput);
      if (signup) {
        passLabel.append(h("span", "sub", "At least 8 characters."));
      }

      const showLabel = h("label", "check");
      const showBox = document.createElement("input");
      showBox.type = "checkbox";
      showBox.onchange = function () {
        passInput.type = showBox.checked ? "text" : "password";
      };
      showLabel.append(showBox, " Show password");

      const submit = h("button", "primary", signup ? "Create account" : "Log in");
      submit.type = "submit";
      const err = h("p", "error");

      form.append(userLabel, passLabel, showLabel, submit);
      app.append(form, err);

      const alt = h("p", "sub", signup ? "Already have an account? " : "No account yet? ");
      const altLink = h("a", "", signup ? "Log in" : "Sign up");
      altLink.href = signup ? "#/login" : "#/signup";
      alt.append(altLink);
      app.append(alt);

      userInput.focus();

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        err.textContent = "";
        const username = userInput.value.trim();
        const password = passInput.value;

        if (!username) { err.textContent = "Enter your username"; return; }
        if (!password) { err.textContent = "Enter your password"; return; }
        if (signup) {
          if (!/^[A-Za-z0-9_.-]{3,30}$/.test(username)) {
            err.textContent = "Username must be 3 to 30 characters: letters, numbers, dots, dashes or underscores";
            return;
          }
          if (password.length < 8) {
            err.textContent = "Password must be at least 8 characters";
            return;
          }
        }

        submit.disabled = true;
        const r = await api(signup ? "/api/auth/signup" : "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password }),
        });
        submit.disabled = false;

        if (!r.ok) {
          err.textContent = (r.data && r.data.error) || "Something went wrong. Try again.";
          return;
        }
        currentUser = r.data.user;
        renderTopbar();
        location.hash = "#/";
      });
    }

    async function showHome() {
      const id = ++renderId;
      app.textContent = "";
      const [j, n, s] = await Promise.all([
        api("/api/journals/"), api("/api/notes/"), api("/api/stats/"),
      ]);
      if (id !== renderId) return;
      if (!j.ok || !Array.isArray(j.data)) {
        showMessage("Couldn't load your journals. Refresh the page.");
        return;
      }

      const counts = {};
      for (const note of (Array.isArray(n.data) ? n.data : [])) {
        counts[note.journal_id] = (counts[note.journal_id] || 0) + 1;
      }

      app.append(h("h1", "", "My journals"));
      app.append(buildThemePanel());
      applyTheme();

      const list = h("div", "list");
      if (j.data.length === 0) {
        list.append(h("p", "sub", "No journals yet. Create one below."));
      }
      for (const journal of j.data) {
        const a = h("a", "card");
        a.href = "#/j/" + journal.id;
        const grow = h("div", "grow");
        grow.append(
          h("strong", "", journal.name),
          h("span", "sub", plural(counts[journal.id] || 0, "note"))
        );
        a.append(grow, h("span", "go", "\u203A"));
        list.append(a);
      }
      app.append(list);

      const form = h("form", "row");
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.placeholder = "New journal name";
      nameInput.autocomplete = "off";
      const create = h("button", "", "Create journal");
      create.type = "submit";
      form.append(nameInput, create);
      const err = h("p", "error");
      app.append(form, err);

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        err.textContent = "";
        const r = await api("/api/journals/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nameInput.value }),
        });
        if (!r.ok) {
          err.textContent = (r.data && r.data.error) || "Couldn't create the journal";
          return;
        }
        location.hash = "#/j/" + r.data.id;
      });

      if (s.ok && s.data) {
        app.append(h("p", "sub",
          "All journals: " + plural(s.data.total_notes, "note") + ", " +
          plural(s.data.total_words, "word")));
      }
    }

    async function showJournal(jid) {
      const id = ++renderId;
      app.textContent = "";
      const [j, n] = await Promise.all([
        api("/api/journals/"), api("/api/notes/?journal_id=" + jid),
      ]);
      if (id !== renderId) return;
      const journal = (Array.isArray(j.data) ? j.data : []).find(function (x) { return x.id === jid; });
      if (!journal) { showMessage("That journal doesn't exist."); return; }

      app.append(backLink("#/", "All journals"));
      app.append(h("h1", "", journal.name));

      const notes = (n.ok && Array.isArray(n.data)) ? n.data : [];

      const add = h("a", "btn", "New note");
      add.href = "#/j/" + jid + "/new";
      const renameBtn = h("button", "", "Rename");
      const deleteBtn = h("button", "", "Delete journal");
      const actions = h("div", "actions");
      actions.append(add, renameBtn, deleteBtn);
      app.append(actions);

      const renameForm = h("form", "row");
      renameForm.hidden = true;
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.value = journal.name;
      nameInput.maxLength = 60;
      nameInput.autocomplete = "off";
      const saveName = h("button", "primary", "Save");
      saveName.type = "submit";
      const cancelName = h("button", "", "Cancel");
      cancelName.type = "button";
      renameForm.append(nameInput, saveName, cancelName);
      const err = h("p", "error");
      app.append(renameForm, err);

      renameBtn.onclick = function () {
        renameForm.hidden = false;
        nameInput.focus();
        nameInput.select();
      };
      cancelName.onclick = function () {
        renameForm.hidden = true;
        nameInput.value = journal.name;
        err.textContent = "";
      };
      renameForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        err.textContent = "";
        const r = await api("/api/journals/" + jid, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nameInput.value }),
        });
        if (!r.ok) {
          err.textContent = (r.data && r.data.error) || "Couldn't rename the journal";
          return;
        }
        showJournal(jid);
      });

      deleteBtn.onclick = async function () {
        const msg = notes.length
          ? 'Delete "' + journal.name + '" and its ' + plural(notes.length, "note") + "? This can't be undone."
          : 'Delete "' + journal.name + '"?';
        if (!window.confirm(msg)) return;
        const r = await api("/api/journals/" + jid, { method: "DELETE" });
        if (!r.ok) {
          err.textContent = (r.data && r.data.error) || "Couldn't delete the journal";
          return;
        }
        location.hash = "#/";
      };

      if (!n.ok) {
        app.append(h("p", "error", "Couldn't load notes: " + ((n.data && n.data.error) || "server error")));
      }

      const list = h("div", "list");
      app.append(list);
      if (notes.length === 0) {
        list.append(h("p", "sub", "No notes yet. Start with New note."));
      }

      for (const note of notes) {
        const a = h("a", "card");
        a.href = "#/j/" + jid + "/n/" + note.id;
        const text = note.text || "";
        const snippet = text.length > 120 ? text.slice(0, 120) + "\u2026" : text;
        const grow = h("div", "grow");
        grow.append(
          h("strong", "", note.title),
          h("span", "sub", new Date(note.created_at).toLocaleString()),
          h("div", "snippet", snippet)
        );
        a.append(grow, h("span", "go", "\u203A"));
        list.append(a);
      }
    }

    async function showNewNote(jid) {
      const id = ++renderId;
      app.textContent = "";
      const j = await api("/api/journals/");
      if (id !== renderId) return;
      const journal = (Array.isArray(j.data) ? j.data : []).find(function (x) { return x.id === jid; });
      if (!journal) { showMessage("That journal doesn't exist."); return; }

      app.append(backLink("#/j/" + jid, journal.name));
      app.append(h("h1", "", "New note"));

      const form = document.createElement("form");
      const titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.placeholder = "Title";
      titleInput.autocomplete = "off";
      const textInput = document.createElement("textarea");
      textInput.rows = 6;
      textInput.placeholder = "Write something...";

      const titleStyle = { font: "sans", size: 20, color: "", bold: true };
      const bodyStyle = { font: "sans", size: 16, color: "" };
      const styleBox = h("details");
      styleBox.append(h("summary", "", "Style this note"));
      styleBox.append(buildAllControls(
        titleStyle, bodyStyle,
        function (s) { applyTitle(titleInput, s); },
        function (s) { applyText(textInput, s); },
        function () {}
      ));
      applyTitle(titleInput, titleStyle);
      applyText(textInput, bodyStyle);

      const save = h("button", "primary", "Save note");
      save.type = "submit";
      const err = h("p", "error");
      form.append(titleInput, textInput, styleBox, save);
      app.append(form, err);

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        err.textContent = "";
        save.disabled = true;

        const r = await api("/api/notes/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: titleInput.value,
            text: textInput.value,
            journal_id: jid,
            font: bodyStyle.font, size: bodyStyle.size, color: bodyStyle.color,
            title_font: titleStyle.font, title_size: titleStyle.size,
            title_color: titleStyle.color, title_bold: titleStyle.bold,
          }),
        });

        if (!r.ok) {
          err.textContent = (r.data && r.data.error) || "Couldn't save the note";
          save.disabled = false;
          return;
        }
        location.hash = "#/j/" + jid + "/n/" + r.data.id;
      });
    }

    async function showNote(jid, nid) {
      const id = ++renderId;
      app.textContent = "";
      const [j, n] = await Promise.all([
        api("/api/journals/"), api("/api/notes/?journal_id=" + jid),
      ]);
      if (id !== renderId) return;
      const journal = (Array.isArray(j.data) ? j.data : []).find(function (x) { return x.id === jid; });
      if (!journal) { showMessage("That journal doesn't exist."); return; }
      const note = (Array.isArray(n.data) ? n.data : []).find(function (x) { return x.id === nid; });
      if (!note) {
        app.append(h("p", "error", "That note doesn't exist."), backLink("#/j/" + jid, journal.name));
        return;
      }

      app.append(backLink("#/j/" + jid, journal.name));

      const titleStyle = {
        font: note.title_font, size: note.title_size,
        color: note.title_color, bold: Boolean(note.title_bold),
      };
      const bodyStyle = { font: note.font, size: note.size, color: note.color };

      const title = h("div", "note-title", note.title);
      applyTitle(title, titleStyle);
      const meta = h("div", "meta", new Date(note.created_at).toLocaleString());
      const body = h("div", "note-text", note.text);
      applyText(body, bodyStyle);

      const view = h("div");
      view.append(title, meta, body);
      app.append(view);

      const err = h("p", "error");

      const editForm = h("form");
      editForm.hidden = true;
      const editTitle = document.createElement("input");
      editTitle.type = "text";
      editTitle.value = note.title;
      editTitle.autocomplete = "off";
      const editText = document.createElement("textarea");
      editText.rows = 8;
      editText.value = note.text;
      const saveEdit = h("button", "primary", "Save changes");
      saveEdit.type = "submit";
      const cancelEdit = h("button", "", "Cancel");
      cancelEdit.type = "button";
      const editActions = h("div", "actions");
      editActions.append(saveEdit, cancelEdit);
      editForm.append(editTitle, editText, editActions);
      app.append(editForm);

      const controls = buildAllControls(
        titleStyle, bodyStyle,
        function (s) { applyTitle(title, s); },
        function (s) { applyText(body, s); },
        async function () {
          err.textContent = "";
          const r = await api("/api/notes/" + note.id + "/style", {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: styleBody(titleStyle, bodyStyle),
          });
          if (!r.ok) err.textContent = (r.data && r.data.error) || "Couldn't save the style";
        }
      );
      controls.hidden = true;

      const editBtn = h("button", "", "Edit");
      const styleBtn = h("button", "", "Style");
      styleBtn.setAttribute("aria-expanded", "false");
      const del = h("button", "", "Delete note");
      const actions = h("div", "actions");
      actions.append(editBtn, styleBtn, del);
      app.append(actions, controls, err);

      function setStyleOpen(open) {
        controls.hidden = !open;
        styleBtn.textContent = open ? "Close style" : "Style";
        styleBtn.setAttribute("aria-expanded", open ? "true" : "false");
      }
      function stopEditing() {
        editForm.hidden = true;
        view.hidden = false;
        actions.hidden = false;
        setStyleOpen(false);
      }
      editBtn.onclick = function () {
        err.textContent = "";
        view.hidden = true;
        actions.hidden = true;
        setStyleOpen(false);
        editForm.hidden = false;
        editTitle.focus();
      };
      cancelEdit.onclick = function () {
        editTitle.value = note.title;
        editText.value = note.text;
        err.textContent = "";
        stopEditing();
      };
      editForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        err.textContent = "";
        const r = await api("/api/notes/" + note.id, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: editTitle.value, text: editText.value }),
        });
        if (!r.ok) {
          err.textContent = (r.data && r.data.error) || "Couldn't save your changes";
          return;
        }
        showNote(jid, nid);
      });

      styleBtn.onclick = function () { setStyleOpen(controls.hidden); };
      del.onclick = async function () {
        if (!window.confirm("Delete this note?")) return;
        await api("/api/notes/" + note.id, { method: "DELETE" });
        location.hash = "#/j/" + jid;
      };
    }

    function route() {
      const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
      const first = parts[0] || "";

      if (!currentUser) {
        if (!AUTH_PAGES.includes(first)) { location.hash = "#/welcome"; return; }
        if (first === "login") return showAuthForm("login");
        if (first === "signup") return showAuthForm("signup");
        return showWelcome();
      }

      if (AUTH_PAGES.includes(first)) { location.hash = "#/"; return; }

      if (first === "j" && Number.isInteger(Number(parts[1]))) {
        const jid = Number(parts[1]);
        if (parts[2] === "new") return showNewNote(jid);
        if (parts[2] === "n" && Number.isInteger(Number(parts[3]))) {
          return showNote(jid, Number(parts[3]));
        }
        return showJournal(jid);
      }
      return showHome();
    }

    async function start() {
      const r = await api("/api/auth/me");
      currentUser = (r.ok && r.data && r.data.user) ? r.data.user : null;
      renderTopbar();
      route();
    }

    window.addEventListener("hashchange", route);
    start();
  </script>
</body>
</html>
