<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Journals</title>
  <style>
    :root {
      --bg: #ffffff; --card: #f4f4f1; --text: #2c2c2a; --sub: #5f5e5a;
      --line: #d3d1c7; --accent: #3b6cf6; --on: #ffffff; --err: #c0392b;
    }
    [hidden] { display: none !important; }
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: var(--text); }
    input[type="text"], textarea, select { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-bottom: 0.5rem; font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
    button { font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 0.35rem 0.8rem; cursor: pointer; }
    button.primary, .btn { background: var(--accent); color: var(--on); border-color: var(--accent); }
    .btn { display: inline-block; border-radius: 6px; padding: 0.4rem 0.9rem; text-decoration: none; }
    .back { display: inline-block; margin-bottom: 0.6rem; color: var(--accent); text-decoration: none; }
    .list { display: grid; gap: 0.6rem; margin: 0.8rem 0; }
    .card { display: flex; gap: 0.7rem; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.8rem; color: var(--text); text-decoration: none; }
    .card:hover { border-color: var(--accent); }
    .card .grow { flex: 1; min-width: 0; }
    .card strong { display: block; }
    .card .go { color: var(--sub); font-size: 1.2rem; }
    .sub { color: var(--sub); font-size: 0.85rem; }
    .snippet { color: var(--sub); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex: none; }
    .note-title { line-height: 1.3; }
    .meta { font-size: 0.8rem; color: var(--sub); margin: 0.2rem 0 0.6rem; }
    .note-text { line-height: 1.5; margin-bottom: 0.8rem; white-space: pre-wrap; }
    .pics { display: grid; gap: 0.6rem; margin-bottom: 0.8rem; }
    .pic img { display: block; max-width: 100%; border-radius: 8px; margin-bottom: 0.3rem; }
    .file-row { display: block; margin-bottom: 0.5rem; color: var(--sub); font-size: 0.9rem; }
    .file-row input { display: block; margin-top: 0.2rem; max-width: 100%; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
    .error { color: var(--err); min-height: 1.2em; margin: 0.2rem 0; }
    .row { display: flex; gap: 0.4rem; }
    .row input { margin-bottom: 0; }
    details { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 0.8rem; margin: 0.6rem 0; }
    summary { cursor: pointer; font-weight: 500; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; margin-top: 0.6rem; }
    .theme-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px 10px; border-radius: 8px; border-width: 2px; border-style: solid; text-align: left; }
    .theme-btn.on { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-dots span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; border: 1px solid rgba(128, 128, 128, 0.5); }
    .style-box { display: grid; gap: 0.5rem; margin: 0.3rem 0 0.6rem; padding: 0.6rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px; font-size: 0.9rem; }
    .style-box label { display: block; color: var(--sub); }
    .style-box select { margin: 0.2rem 0 0; }
    .style-box input[type="range"] { width: 100%; }
    .group-title { font-weight: 500; margin: 0.6rem 0 0.2rem; }
    .swatches { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: 0.2rem; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; padding: 0; border: 2px solid var(--line); }
    .swatch.on { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type="color"] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--line); background: none; }
  </style>
</head>
<body>
  <main id="app"></main>

  <script>
    const THEMES = {
      light:    { label: "Light",         dark: false, bg: "#ffffff", card: "#f4f4f1", text: "#2c2c2a", sub: "#5f5e5a", line: "#d3d1c7", accent: "#3b6cf6", on: "#ffffff", err: "#c0392b" },
      dark:     { label: "Dark",          dark: true,  bg: "#1f1f1e", card: "#2c2c2a", text: "#f1efe8", sub: "#b4b2a9", line: "#444441", accent: "#85b7eb", on: "#042c53", err: "#f09595" },
      midnight: { label: "Midnight",      dark: true,  bg: "#0f172a", card: "#1e293b", text: "#e2e8f0", sub: "#94a3b8", line: "#334155", accent: "#818cf8", on: "#1e1b4b", err: "#fca5a5" },
      sepia:    { label: "Sepia",         dark: false, bg: "#f6efe0", card: "#ece1c8", text: "#433422", sub: "#7a6548", line: "#d6c7a3", accent: "#9a5b13", on: "#ffffff", err: "#a32d2d" },
      forest:   { label: "Forest",        dark: false, bg: "#f1f6ef", card: "#e0ebdc", text: "#1f3326", sub: "#4f6b57", line: "#bcd2b8", accent: "#2f7d4f", on: "#ffffff", err: "#b3261e" },
      ocean:    { label: "Ocean",         dark: false, bg: "#eef6fb", card: "#dcecf7", text: "#12324a", sub: "#4a6a82", line: "#b5d3e6", accent: "#1769aa", on: "#ffffff", err: "#b3261e" },
      rose:     { label: "Rose",          dark: false, bg: "#fdf1f4", card: "#f8e0e7", text: "#3d1f2a", sub: "#7a4a5a", line: "#efc3cf", accent: "#c2185b", on: "#ffffff", err: "#b3261e" },
      lavender: { label: "Lavender",      dark: false, bg: "#f4f1fb", card: "#e7e0f5", text: "#2a2342", sub: "#5d5480", line: "#cfc5e8", accent: "#6a4fc4", on: "#ffffff", err: "#b3261e" },
      sunset:   { label: "Sunset",        dark: true,  bg: "#2a1a14", card: "#3b2820", text: "#fbeadf", sub: "#d2ab98", line: "#5a3d31", accent: "#ff9a62", on: "#3b1a08", err: "#ffb4a8" },
      contrast: { label: "High contrast", dark: true,  bg: "#000000", card: "#111111", text: "#ffffff", sub: "#d0d0d0", line: "#ffffff", accent: "#ffd400", on: "#000000", err: "#ff8a80" },
    };
    const THEME_VARS = {
      bg: "--bg", card: "--card", text: "--text", sub: "--sub",
      line: "--line", accent: "--accent", on: "--on", err: "--err",
    };
    const FONTS = {
      sans: "system-ui, sans-serif",
      serif: "Georgia, 'Times New Roman', serif",
      book: "Palatino, 'Palatino Linotype', 'Book Antiqua', serif",
      mono: "ui-monospace, Menlo, monospace",
      cursive: "'Snell Roundhand', 'Segoe Script', 'Comic Sans MS', cursive",
      rounded: "ui-rounded, 'SF Pro Rounded', system-ui, sans-serif",
    };
    const FONT_LABELS = {
      sans: "Sans", serif: "Serif", book: "Book", mono: "Mono",
      cursive: "Handwritten", rounded: "Rounded",
    };
    const SWATCHES = ["", "#D85A30", "#E24B4A", "#BA7517", "#639922",
                      "#1D9E75", "#378ADD", "#7F77DD", "#D4537E", "#888780"];
    const IMAGE_TYPES = "image/png,image/jpeg,image/gif,image/webp";

    const app = document.getElementById("app");
    let renderId = 0;
    let flash = "";

    function h(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    async function api(url, options) {
      try {
        const r = await fetch(url, options);
        let data = null;
        try { data = await r.json(); } catch (e) {}
        return { ok: r.ok, data: data };
      } catch (e) {
        return { ok: false, data: { error: "Couldn't reach the server" } };
      }
    }

    function backLink(href, label) {
      const a = h("a", "back", "\u2190 " + label);
      a.href = href;
      return a;
    }

    function showMessage(text) {
      app.textContent = "";
      app.append(h("p", "error", text), backLink("#/", "All journals"));
    }

    let theme = "light";
    try {
      const saved = localStorage.getItem("journalTheme");
      if (saved && THEMES[saved]) theme = saved;
    } catch (e) {}

    function applyTheme() {
      const t = THEMES[theme];
      const root = document.documentElement;
      root.dataset.theme = theme;
      for (const key of Object.keys(THEME_VARS)) {
        root.style.setProperty(THEME_VARS[key], t[key]);
      }
      root.style.colorScheme = t.dark ? "dark" : "light";
      document.querySelectorAll(".theme-btn").forEach(function (b) {
        const on = b.dataset.theme === theme;
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }

    function buildThemeButtons(grid) {
      for (const key of Object.keys(THEMES)) {
        const t = THEMES[key];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "theme-btn";
        btn.dataset.theme = key;
        btn.style.background = t.bg;
        btn.style.color = t.text;
        btn.style.borderColor = t.line;

        const name = document.createElement("span");
        name.textContent = t.label;

        const dots = document.createElement("span");
        dots.className = "theme-dots";
        for (const colour of [t.accent, t.text, t.card]) {
          const d = document.createElement("span");
          d.style.background = colour;
          dots.append(d);
        }

        btn.append(name, dots);
        btn.onclick = function () {
          theme = key;
          applyTheme();
          try { localStorage.setItem("journalTheme", theme); } catch (err) {}
        };
        grid.append(btn);
      }
    }

    applyTheme();

    function applyText(el, s) {
      el.style.fontFamily = FONTS[s.font] || FONTS.sans;
      el.style.fontSize = s.size + "px";
      el.style.color = s.color || "";
    }

    function applyTitle(el, s) {
      applyText(el, s);
      el.style.fontWeight = s.bold ? "700" : "400";
    }

    function buildStyleControls(style, preview, commit, opts) {
      const box = document.createElement("div");
      box.className = "style-box";

      const fontLabel = document.createElement("label");
      fontLabel.textContent = "Font";
      const fontSel = document.createElement("select");
      for (const key of Object.keys(FONTS)) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = FONT_LABELS[key];
        fontSel.append(opt);
      }
      fontSel.value = style.font;
      fontSel.onchange = function () {
        style.font = fontSel.value;
        preview(style);
        commit();
      };
      fontLabel.append(fontSel);

      const sizeLabel = document.createElement("label");
      const sizeOut = document.createElement("span");
      sizeOut.textContent = style.size;
      sizeLabel.append("Size: ", sizeOut, " px");
      const range = document.createElement("input");
      range.type = "range";
      range.min = opts.min; range.max = opts.max; range.step = 1;
      range.value = style.size;
      range.oninput = function () {
        style.size = Number(range.value);
        sizeOut.textContent = style.size;
        preview(style);
      };
      range.onchange = function () { commit(); };
      sizeLabel.append(range);

      const colorLabel = document.createElement("label");
      colorLabel.append("Colour");
      const swatchRow = document.createElement("div");
      swatchRow.className = "swatches";
      const picker = document.createElement("input");
      picker.type = "color";
      picker.value = style.color || "#000000";
      picker.setAttribute("aria-label", "Custom colour");

      function markSwatches() {
        swatchRow.querySelectorAll(".swatch").forEach(function (b) {
          b.classList.toggle("on", b.dataset.col === style.color);
        });
      }
      for (const col of SWATCHES) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "swatch";
        b.dataset.col = col;
        b.style.background = col || "var(--text)";
        b.setAttribute("aria-label", col ? "Colour " + col : "Default colour");
        b.onclick = function () {
          style.color = col;
          if (col) picker.value = col;
          markSwatches();
          preview(style);
          commit();
        };
        swatchRow.append(b);
      }
      picker.oninput = function () {
        style.color = picker.value;
        markSwatches();
        preview(style);
      };
      picker.onchange = function () { commit(); };
      swatchRow.append(picker);
      colorLabel.append(swatchRow);
      markSwatches();

      box.append(fontLabel, sizeLabel, colorLabel);

      if (opts.bold) {
        const boldLabel = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = style.bold;
        cb.onchange = function () {
          style.bold = cb.checked;
          preview(style);
          commit();
        };
        boldLabel.append(cb, " Bold");
        box.append(boldLabel);
      }
      return box;
    }

    function buildAllControls(titleStyle, bodyStyle, previewTitle, previewBody, commit) {
      const wrap = document.createElement("div");
      wrap.append(
        h("div", "group-title", "Title style"),
        buildStyleControls(titleStyle, previewTitle, commit, { min: 14, max: 48, bold: true }),
        h("div", "group-title", "Text style"),
        buildStyleControls(bodyStyle, previewBody, commit, { min: 12, max: 32, bold: false })
      );
      return wrap;
    }

    async function uploadFiles(noteId, files) {
      for (const file of files) {
        const form = new FormData();
        form.append("note_id", noteId);
        form.append("file", file);
        const r = await api("/api/images/", { method: "POST", body: form });
        if (!r.ok) {
          const msg = (r.data && r.data.error) || "Upload failed";
          return file.name + ": " + msg;
        }
      }
      return "";
    }

    function plural(n, word) {
      return n + " " + word + (n === 1 ? "" : "s");
    }

    async function showHome() {
      const id = ++renderId;
      app.textContent = "";
      const [j, n, s] = await Promise.all([
        api("/api/journals/"), api("/api/notes/"), api("/api/stats/"),
      ]);
      if (id !== renderId) return;
      if (!j.ok) { showMessage("Couldn't load your journals. Refresh the page."); return; }

      const counts = {};
      for (const note of n.data || []) {
        counts[note.journal_id] = (counts[note.journal_id] || 0) + 1;
      }

      app.append(h("h1", "", "My journals"));

      const themeBox = h("details");
      themeBox.append(h("summary", "", "Theme"));
      const grid = h("div", "theme-grid");
      buildThemeButtons(grid);
      themeBox.append(grid);
      app.append(themeBox);
      applyTheme();

      const list = h("div", "list");
      for (const journal of j.data) {
        const a = h("a", "card");
        a.href = "#/j/" + journal.id;
        const grow = h("div", "grow");
        grow.append(
          h("strong", "", journal.name),
          h("span", "sub", plural(counts[journal.id] || 0, "note"))
        );
        a.append(grow, h("span", "go", "\u203A"));
        list.append(a);
      }
      app.append(list);

      const form = h("form", "row");
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.placeholder = "New journal name";
      nameInput.autocomplete = "off";
      const create = h("button", "", "Create journal");
      create.type = "submit";
      form.append(nameInput, create);
      const err = h("p", "error");
      app.append(form, err);

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        err.textContent = "";
        const r = await api("/api/journals/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nameInput.value }),
        });
        if (!r.ok) {
          err.textContent = (r.data && r.data.error) || "Couldn't create the journal";
          return;
        }
        location.hash = "#/j/" + r.data.id;
      });

      if (s.ok && s.data) {
        app.append(h("p", "sub",
          "All journals: " + plural(s.data.total_notes, "note") + ", " +
          plural(s.data.total_words, "word")));
      }
    }

    async function showJournal(jid) {
      const id = ++renderId;
      app.textContent = "";
      const [j, n] = await Promise.all([
        api("/api/journals/"), api("/api/notes/?journal_id=" + jid),
      ]);
      if (id !== renderId) return;
      const journal = ((j.data) || []).find(function (x) { return x.id === jid; });
      if (!journal) { showMessage("That journal doesn't exist."); return; }

      app.append(backLink("#/", "All journals"));
      app.append(h("h1", "", journal.name));

      const add = h("a", "btn", "New note");
      add.href = "#/j/" + jid + "/new";
      app.append(add);

      const notes = (n.ok && n.data) || [];
      const list = h("div", "list");
      if (notes.length === 0) {
        list.append(h("p", "sub", "No notes yet. Start with New note."));
      }
      for (const note of notes) {
        const a = h("a", "card");
        a.href = "#/j/" + jid + "/n/" + note.id;

        const noteImages = note.images || [];
        if (noteImages.length) {
          const t = document.createElement("img");
          t.className = "thumb";
          t.src = noteImages[0].url;
          t.alt = "";
          t.loading = "lazy";
          a.append(t);
        }

        const grow = h("div", "grow");
        const snippet = note.text.length > 120 ? note.text.slice(0, 120) + "\u2026" : note.text;
        grow.append(
          h("strong", "", note.title),
          h("span", "sub", new Date(note.created_at).toLocaleString()),
          h("div", "snippet", snippet)
        );
        a.append(grow, h("span", "go", "\u203A"));
        list.append(a);
      }
      app.append(list);
    }

    async function showNewNote(jid) {
      const id = ++renderId;
      app.textContent = "";
      const j = await api("/api/journals/");
      if (id !== renderId) return;
      const journal = ((j.data) || []).find(function (x) { return x.id === jid; });
      if (!journal) { showMessage("That journal doesn't exist."); return; }

      app.append(backLink("#/j/" + jid, journal.name));
      app.append(h("h1", "", "New note"));

      const form = document.createElement("form");
      const titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.placeholder = "Title";
      titleInput.autocomplete = "off";
      const textInput = document.createElement("textarea");
      textInput.rows = 6;
      textInput.placeholder = "Write something...";

      const fileLabel = h("label", "file-row", "Pictures (optional, 5 MB each)");
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = IMAGE_TYPES;
      fileInput.multiple = true;
      fileLabel.append(fileInput);

      const titleStyle = { font: "sans", size: 20, color: "", bold: true };
      const bodyStyle = { font: "sans", size: 16, color: "" };
      const styleBox = h("details");
      styleBox.append(h("summary", "", "Style this note"));
      styleBox.append(buildAllControls(
        titleStyle, bodyStyle,
        function (s) { applyTitle(titleInput, s); },
        function (s) { applyText(textInput, s); },
        function () {}
      ));
      applyTitle(titleInput, titleStyle);
      applyText(textInput, bodyStyle);

      const save = h("button", "primary", "Save note");
      save.type = "submit";
      const err = h("p", "error");
      form.append(titleInput, textInput, styleBox, save);
      app.append(form, err);

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        err.textContent = "";
        save.disabled = true;

        const r = await api("/api/notes/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: titleInput.value,
            text: textInput.value,
            journal_id: jid,
            font: bodyStyle.font, size: bodyStyle.size, color: bodyStyle.color,
            title_font: titleStyle.font, title_size: titleStyle.size,
            title_color: titleStyle.color, title_bold: titleStyle.bold,
          }),
        });

        if (!r.ok) {
          err.textContent = (r.data && r.data.error) || "Couldn't save the note";
          save.disabled = false;
          return;
        }

        const files = Array.from(fileInput.files);
        if (files.length) {
          const msg = await uploadFiles(r.data.id, files);
          if (msg) flash = "Note saved, but a picture failed. " + msg;
        }
        location.hash = "#/j/" + jid + "/n/" + r.data.id;
      });
    }

    async function showNote(jid, nid) {
      const id = ++renderId;
      app.textContent = "";
      const [j, n] = await Promise.all([
        api("/api/journals/"), api("/api/notes/?journal_id=" + jid),
      ]);
      if (id !== renderId) return;
      const journal = ((j.data) || []).find(function (x) { return x.id === jid; });
      if (!journal) { showMessage("That journal doesn't exist."); return; }
      const note = ((n.data) || []).find(function (x) { return x.id === nid; });
      if (!note) {
        app.append(h("p", "error", "That note doesn't exist."), backLink("#/j/" + jid, journal.name));
        return;
      }

      app.append(backLink("#/j/" + jid, journal.name));

      const titleStyle = {
        font: note.title_font, size: note.title_size,
        color: note.title_color, bold: Boolean(note.title_bold),
      };
      const bodyStyle = { font: note.font, size: note.size, color: note.color };

      const title = h("div", "note-title", note.title);
      applyTitle(title, titleStyle);
      const meta = h("div", "meta", new Date(note.created_at).toLocaleString());
      const body = h("div", "note-text", note.text);
      applyText(body, bodyStyle);
      app.append(title, meta, body);

      const err = h("p", "error", flash);
      flash = "";

      const pics = h("div", "pics");
      for (const image of (note.images || [])) {
        const wrap = h("div", "pic");
        const img = document.createElement("img");
        img.src = image.url;
        img.alt = "Picture in " + note.title;
        img.loading = "lazy";
        const rm = h("button", "", "Remove picture");
        rm.onclick = async function () {
          await api("/api/images/" + image.id, { method: "DELETE" });
          showNote(jid, nid);
        };
        wrap.append(img, rm);
        pics.append(wrap);
      }
      app.append(pics);

      const controls = buildAllControls(
        titleStyle, bodyStyle,
        function (s) { applyTitle(title, s); },
        function (s) { applyText(body, s); },
        async function () {
          err.textContent = "";
          const r = await api("/api/notes/" + note.id + "/style", {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              font: bodyStyle.font, size: bodyStyle.size, color: bodyStyle.color,
              title_font: titleStyle.font, title_size: titleStyle.size,
              title_color: titleStyle.color, title_bold: titleStyle.bold,
            }),
          });
          if (!r.ok) err.textContent = (r.data && r.data.error) || "Couldn't save the style";
        }
      );
      controls.hidden = true;
      app.append(controls);

      const picInput = document.createElement("input");
      picInput.type = "file";
      picInput.accept = IMAGE_TYPES;
      picInput.multiple = true;
      picInput.hidden = true;
      picInput.onchange = async function () {
        const msg = await uploadFiles(note.id, Array.from(picInput.files));
        if (msg) flash = msg;
        showNote(jid, nid);
      };

      const styleBtn = h("button", "", "Style");
      styleBtn.onclick = function () { controls.hidden = !controls.hidden; };
      const addPic = h("button", "", "Add picture");
      addPic.onclick = function () { picInput.click(); };
      const del = h("button", "", "Delete note");
      del.onclick = async function () {
        if (!window.confirm("Delete this note and its pictures?")) return;
        await api("/api/notes/" + note.id, { method: "DELETE" });
        location.hash = "#/j/" + jid;
      };

      const actions = h("div", "actions");
      actions.append(styleBtn, del);
      app.append(actions, err);
    }

    function route() {
      const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
      if (parts[0] === "j" && Number.isInteger(Number(parts[1]))) {
        const jid = Number(parts[1]);
        if (parts[2] === "new") return showNewNote(jid);
        if (parts[2] === "n" && Number.isInteger(Number(parts[3]))) {
          return showNote(jid, Number(parts[3]));
        }
        return showJournal(jid);
      }
      return showHome();
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
