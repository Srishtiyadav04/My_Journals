<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Notes</title>
</head>
<body>
  <h1>My Notes</h1>

  <form id="note-form">
    <input id="note-input" type="text" placeholder="Write a note..." autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <p id="error" style="color: red;"></p>

  <p>Notes: <strong id="stat-total">0</strong></p>
  <p>Words: <strong id="stat-words">0</strong></p>

  <ul id="note-list"></ul>

  <script>
    const form = document.getElementById("note-form");
    const input = document.getElementById("note-input");
    const errorBox = document.getElementById("error");

    async function loadNotes() {
      const response = await fetch("/api/notes/");
      const notes = await response.json();

      const list = document.getElementById("note-list");
      list.innerHTML = "";
      for (const note of notes) {
        const li = document.createElement("li");
        li.textContent = note.text;
        list.append(li);
      }
    }

    async function loadStats() {
      const response = await fetch("/api/stats/");
      const stats = await response.json();

      document.getElementById("stat-total").textContent = stats.total_notes;
      document.getElementById("stat-words").textContent = stats.total_words;
    }

    function refresh() {
      loadNotes();
      loadStats();
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      errorBox.textContent = "";

      const response = await fetch("/api/notes/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value }),
      });

      if (!response.ok) {
        const data = await response.json();
        errorBox.textContent = data.error;
        return;
      }

      input.value = "";
      refresh();
    });

    refresh();
  </script>
</body>
</html>
